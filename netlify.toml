[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Use latest stable Node for Vite + TS
  NODE_VERSION = "20"

# Optional: security / performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Explicitly allow AI crawlers (already in robots.txt too)
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
